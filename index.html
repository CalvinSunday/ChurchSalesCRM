<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Site Disabled</title>
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <style>
      :root {
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
        background: #0b0c0f;
        color: #e9ecf1;
        display: grid;
        place-items: center;
        padding: 20px;
      }
      .panel {
        width: min(760px, 100%);
        border: 1px solid #262b36;
        border-radius: 14px;
        padding: 22px;
        background: #12141a;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 24px;
      }
      p {
        margin: 8px 0;
        color: #9aa3b2;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <h1>This Site Is Disabled</h1>
      <p>The public GitHub Pages CRM has been intentionally turned off.</p>
      <p>No CRM application scripts are loaded on this page.</p>
      <p>If access is needed again, restore the app shell and backend only after private hosting controls are in place.</p>
    </main>
  </body>
</html>
